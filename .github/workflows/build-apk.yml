name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Sync web app into Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk work-calendar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: work-calendar-apk
          path: work-calendar.apk

      - name: Move "latest" tag to this commit
        if: github.event_name != 'pull_request'
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Последняя сборка
          body: |
            APK для Android. Скачайте `work-calendar.apk` на телефон и откройте файл.
            Сборка подписана постоянным ключом, поэтому новая версия ставится поверх старой, данные сохраняются.
          files: work-calendar.apk
          make_latest: true
