name: Build iOS

on:
  push:
    branches: [main]
    paths-ignore:
      - "android/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate iOS project
        run: npx cap add ios

      - name: App icon
        run: |
          ICONSET=ios/App/App/Assets.xcassets/AppIcon.appiconset
          ls "$ICONSET"
          for f in "$ICONSET"/*.png; do cp ios-assets/AppIcon-1024.png "$f"; done

      - name: Sync web app
        run: npx cap sync ios

      - name: Build (unsigned)
        working-directory: ios/App
        run: |
          if [ -d App.xcworkspace ]; then TARGET="-workspace App.xcworkspace"; else TARGET="-project App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -archivePath "$PWD/build/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive | tail -40

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R ios/App/build/App.xcarchive/Products/Applications/App.app Payload/
          zip -qry work-calendar.ipa Payload
          ls -lh work-calendar.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: work-calendar-ipa
          path: work-calendar.ipa

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Последняя сборка
          files: work-calendar.ipa
