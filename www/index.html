<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WorkTime">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{color-scheme:light}html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>WorkTime</title>
<style>
/* Layout: translucent sticky nav (prev/next, Неделя|Месяц, настройки), large title, summary card with ring,
   month grid or week rows, bottom sheets for entry and settings. Palette: iOS system colors. Type: system UI stack (SF on Apple). */
:root{
  --bg:#f2f2f7;--card:#ffffff;--sheet:#f2f2f7;--group:#ffffff;
  --fg:#000000;--fg2:#6c6c70;--fg3:#aeaeb2;--sep:rgba(60,60,67,.18);
  --fill:rgba(120,120,128,.12);--seg-on:#ffffff;
  --accent:#007aff;--green:#34c759;--red:#ff3b30;
  --bar:rgba(242,242,247,.82);--toast:#1c1c1e;--toast-fg:#ffffff;--scrim:rgba(0,0,0,.35);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000;--card:#1c1c1e;--sheet:#1c1c1e;--group:#2c2c2e;
    --fg:#ffffff;--fg2:#98989f;--fg3:#636366;--sep:rgba(84,84,88,.55);
    --fill:rgba(120,120,128,.24);--seg-on:#636366;
    --accent:#0a84ff;--green:#30d158;--red:#ff453a;
    --bar:rgba(0,0,0,.72);--toast:#f2f2f7;--toast-fg:#000000;--scrim:rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000;--card:#1c1c1e;--sheet:#1c1c1e;--group:#2c2c2e;
  --fg:#ffffff;--fg2:#98989f;--fg3:#636366;--sep:rgba(84,84,88,.55);
  --fill:rgba(120,120,128,.24);--seg-on:#636366;
  --accent:#0a84ff;--green:#30d158;--red:#ff453a;
  --bar:rgba(0,0,0,.72);--toast:#f2f2f7;--toast-fg:#000000;--scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.35;
  -webkit-font-smoothing:antialiased;min-height:100%;
  padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
body::before{
  content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;
  background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,p{margin:0}

/* nav */
.bar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));
  background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
}
.bar-in{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
.navbtns{display:flex}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--accent)}
.ib:active{background:var(--fill)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{padding:6px 16px;border-radius:7px;font-size:13px;font-weight:600;text-align:center;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--seg-on);box-shadow:0 1px 3px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.05)}
.seg.wide{margin:4px 0 14px}
.seg.wide button{padding:8px 10px;font-size:14px}

/* page */
main{max-width:640px;margin:0 auto;padding:8px 0 48px;display:flex;flex-direction:column;gap:16px}
.titlerow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:4px}
h1{font-size:32px;line-height:1.1;font-weight:800;letter-spacing:-.022em;text-wrap:balance}
.sub{color:var(--fg2);font-size:14px;margin-top:4px}
.pill{background:var(--fill);color:var(--accent);font-weight:600;font-size:14px;padding:7px 14px;border-radius:999px;white-space:nowrap}
.card{background:var(--card);border-radius:16px}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--fill);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--fg2)}
.banner button{color:var(--accent);font-weight:600;white-space:nowrap}
.hint{font-size:13px;color:var(--fg2);text-align:center}

/* summary */
.sum{padding:16px}
.sum .top{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:88px;height:88px;flex:none}
.ring svg{display:block}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.tot{min-width:0}
.tot .cap{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--fg2)}
.tot .big{font-size:28px;line-height:1.15;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tot .of{font-size:13px;color:var(--fg2);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:12px 16px;margin-top:14px;padding-top:12px;border-top:.5px solid var(--sep)}
.stat .l{font-size:12px;color:var(--fg2)}
.stat .v{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}

/* month grid */
.cal{padding:10px 6px 8px}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow span{text-align:center;font-size:11px;font-weight:600;color:var(--fg2);padding:2px 0 8px;text-transform:uppercase;letter-spacing:.03em}
.cell{--heat:var(--accent);position:relative;min-height:58px;margin:2px;border-radius:10px;display:flex;flex-direction:column;align-items:center;padding:4px 1px 3px;gap:3px;text-align:center}
.cell.full{--heat:var(--green)}
.cell.has{background:color-mix(in srgb,var(--heat) var(--h,20%),transparent)}
.cell:active{background:var(--fill)}
.cell .n{width:24px;height:24px;line-height:24px;border-radius:50%;font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.cell .h{font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.cell.off .n{color:var(--fg2)}
.cell.out{opacity:.4}
.cell.today .n{background:var(--red);color:#fff;font-weight:700}

/* rows */
.rows{overflow:hidden}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:12px 16px;border-top:.5px solid var(--sep)}
.row:first-child{border-top:0}
.row:active{background:var(--fill)}
.dayb{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.dayb small{font-size:11px;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.04em}
.dayb b{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.row.today .dayb b{color:var(--red)}
.mid{display:flex;flex-direction:column;gap:6px;min-width:0}
.track{display:block;height:8px;border-radius:4px;background:var(--fill);overflow:hidden}
.fill{display:block;height:100%;border-radius:4px;background:var(--accent);transition:width .4s cubic-bezier(.2,.8,.2,1)}
.fill.full{background:var(--green)}
.note{display:block;font-size:12px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1.2em}
.val{font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.sec{font-size:13px;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.04em;padding:0 4px}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;transition:opacity .25s;z-index:40}
.scrim.open{opacity:1}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:92vh;max-height:92dvh;overflow:auto;
  background:var(--sheet);border-radius:20px 20px 0 0;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);
  box-shadow:0 -8px 40px rgba(0,0,0,.18);
}
.sheet.open{transform:none}
.sheet:focus{outline:none}
.sheet-in{max-width:520px;margin:0 auto}
.grab{width:36px;height:5px;border-radius:3px;background:var(--fg3);opacity:.6;margin:0 auto 10px}
.shead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-bottom:6px}
.shead h2{font-size:17px;font-weight:600;text-align:center;white-space:nowrap}
.txt{color:var(--accent);font-size:17px;padding:6px 0}
.txt.strong{font-weight:600;text-align:right}
.edtotal{font-size:46px;line-height:1.1;font-weight:700;letter-spacing:-.025em;text-align:center;font-variant-numeric:tabular-nums;padding-top:8px}
.edsub{font-size:14px;color:var(--fg2);text-align:center;min-height:1.4em;margin:2px 0 14px;font-variant-numeric:tabular-nums}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:10px}
.steps button,.chips button{background:var(--group);border-radius:12px;padding:12px 4px;text-align:center;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.steps button:active,.chips button:active{background:var(--fill)}
.chips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:12px}
.chips button{color:var(--accent);padding:10px 4px}
.chips button[aria-pressed="true"]{background:var(--accent);color:#fff}
.group{background:var(--group);border-radius:12px;margin-bottom:12px;overflow:hidden}
.frow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 14px;border-top:.5px solid var(--sep);min-height:46px}
.frow:first-child{border-top:0}
.frow input{color:var(--fg);background:transparent;border:0;text-align:right;width:140px;min-width:0;padding:2px 0}
.frow input::placeholder{color:var(--fg3)}
.frow.wideinp input{width:100%;text-align:left}
.frow select{appearance:none;-webkit-appearance:none;background:transparent;border:0;color:var(--accent);font:inherit;text-align:right;text-align-last:right;max-width:62%;min-width:0;padding:2px 0;cursor:pointer;text-overflow:ellipsis}
.frow select option{color:var(--fg);background:var(--group)}
.fnote{font-size:12px;color:var(--fg2);padding:0 4px 12px;margin-top:-6px}
.acts{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.btn{width:100%;padding:14px 16px;border-radius:14px;font-weight:600;text-align:center;background:var(--group)}
.btn:active{opacity:.7}
.btn.primary{background:var(--accent);color:#fff}
label.btn{display:block;cursor:pointer}
.brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:20px}
.brand img{width:48px;height:48px;border-radius:23%;display:block}
.brand b{font-size:19px;letter-spacing:-.01em}
.btn.danger{color:var(--red)}
.gl{font-size:13px;color:var(--fg2);padding:6px 4px 8px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.wds{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:14px}
.wd{background:var(--group);border-radius:10px;padding:11px 0;text-align:center;font-weight:600;font-size:14px;color:var(--fg2)}
.wd.on{background:var(--accent);color:#fff}
.rep{width:100%;height:140px;border-radius:12px;border:0;background:var(--group);color:var(--fg);padding:10px 12px;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;resize:none}
.foot{font-size:12px;color:var(--fg2);text-align:center;margin-top:14px}

.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;
  transform:translate(-50%,16px);opacity:0;pointer-events:none;
  background:var(--toast);color:var(--toast-fg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;
  transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:360px){h1{font-size:28px}.cell{min-height:54px}.cell .h{font-size:10px}}
</style>
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <div class="navbtns">
      <button class="ib" data-a="prev" aria-label="Назад"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button class="ib" data-a="next" aria-label="Вперёд"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>
    <div class="seg" role="group" aria-label="Период">
      <button data-view="week" id="vWeek" aria-pressed="false">Неделя</button>
      <button data-view="month" id="vMonth" aria-pressed="true">Месяц</button>
    </div>
    <button class="ib" data-a="settings" aria-label="Настройки"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
  </div>
</header>

<main id="main"></main>

<div class="scrim" id="scrim" data-a="close" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1" hidden></section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
<script>
if('serviceWorker' in navigator && /\.github\.io$/.test(location.hostname)){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}
</script>
</body>
</html>
